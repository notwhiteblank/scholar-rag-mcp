name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - name: Exclude temp dirs from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
          Set-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
      - run: uv run pytest tests -q -m "not e2e and not perf"
