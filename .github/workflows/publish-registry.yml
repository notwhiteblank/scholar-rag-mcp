name: publish-registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  registry:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: install mcp-publisher
        run: |
          curl -sL -o /tmp/mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /usr/local/bin
      - name: validate and publish to MCP registry
        run: |
          mcp-publisher login github-oidc
          mcp-publisher validate
          mcp-publisher publish
